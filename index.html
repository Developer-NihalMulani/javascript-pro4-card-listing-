<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Product Store
    </title>


    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="p-3">
    <nav class="container">
        <div class="row ">
            <div class="header d-flex justify-content-between align-items-center border-bottom mb-12">

                <div class="logo-frame overflow-hidden col-2">
                    <img src="./photos/logo.jfif" class="rounded-5 object-fit-cover w-100 h-100" alt="">
                </div>

                <div class="col-6 p-2 d-none sm:d-block">
                    <div class="border rounded p-3">
                        <span>
                            <i class="fa-solid fa-magnifying-glass search"></i>
                        </span>
                        <span>
                            <input type="text" class="bg-transparent border-0" placeholder="search for your items...">
                        </span>
                    </div>
                </div>
                <div class="col-1 fw-semibld d-none sm:d-block">
                    <div class="d-flex fs-lg justify-content-between ">
                        <p class=""><i class="ri-poker-hearts-line  "></i></p>
                        <p><i class="ri-user-line"></i></p>
                        <p><i class="ri-shopping-cart-line"></i></p>
                    </div>
                </div>
                <div class="col-3 d-block sm:d-none">
                    <div class="d-flex fs-lg justify-content-between ">
                        <p><i class="fa-solid fa-magnifying-glass search"></i></p>
                        <p><i class="ri-poker-hearts-line  "></i></p>
                        <p><i class="ri-user-line"></i></p>
                        <p><i class="ri-shopping-cart-line"></i></p>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    

    <section>
        <div class="container">
            <div class="row d-flex flex-row flex-wrap justify-content-around" id="pro_container">
               
            </div>
        </div>

    </section>






    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <script src="./app.js">

    </script>
    
</body>

</html>
